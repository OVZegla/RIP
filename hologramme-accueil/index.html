<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hôtesse d'accueil</title>
<style>
  :root {
    --fond: #ffffff;
    --texte: #1d2430;
    --doux: #6b7585;
    --holo: #19b6d8;
    --bulle-agent: #eef8fb;
    --bulle-visiteur: #1d2430;
    --bord: #dfe5ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  #chat { position: fixed; right: 24px; bottom: 24px; width: min(420px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 10px; }
  #fil { max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    padding: 4px; scrollbar-width: thin; }
  .bulle { padding: 10px 14px; border-radius: 16px; line-height: 1.4; font-size: 15px;
    max-width: 88%; white-space: pre-wrap; box-shadow: 0 2px 10px rgba(20,30,40,.08); }
  .agent { background: var(--bulle-agent); border: 1px solid #cdebf3; align-self: flex-start;
    border-bottom-left-radius: 4px; }
  .visiteur { background: var(--bulle-visiteur); color: #fff; align-self: flex-end;
    border-bottom-right-radius: 4px; }
  .systeme { align-self: center; font-size: 13px; color: var(--doux); background: none;
    box-shadow: none; text-align: center; }

  #saisie { display: flex; gap: 8px; background: #fff; border: 1px solid var(--bord);
    border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(20,30,40,.10); }
  #texte { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 8px 12px;
    background: transparent; color: var(--texte); min-width: 0; }
  button { font: inherit; cursor: pointer; border: 0; }
  .rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: #f1f4f7; color: var(--texte); flex: none; }
  .rond:hover { background: #e6ebf0; }
  #envoyer { background: var(--holo); color: #fff; }
  #envoyer:hover { background: #12a0c0; }
  #micro.actif { background: #e5484d; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(229,72,77,.18); } }
  button:disabled { opacity: .45; cursor: default; }

  #barre { position: fixed; left: 24px; top: 20px; display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap; font-size: 13px; color: var(--doux); }
  #barre select, #barre button { font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--bord); background: #fff; color: var(--texte); }
  #etat { min-width: 220px; }
  #progression { width: 160px; height: 4px; background: #eef1f4; border-radius: 4px; overflow: hidden; }
  #progression div { height: 100%; width: 0; background: var(--holo); transition: width .3s; }

  @media (max-width: 700px) {
    #chat { right: 16px; left: 16px; width: auto; bottom: 16px; }
    #fil { max-height: 32vh; }
    #barre { left: 16px; right: 16px; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="barre">
  <select id="modele" title="Modèle de langage (gratuit, exécuté dans le navigateur)">
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B (≈1 Go, meilleur français)</option>
    <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 2.5 0.5B (≈400 Mo, plus rapide)</option>
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (≈900 Mo)</option>
  </select>
  <button id="charger">Charger le modèle</button>
  <label><input type="checkbox" id="voix" checked> Réponse vocale</label>
  <div id="progression"><div></div></div>
  <span id="etat">Modèle non chargé — réponses de démonstration.</span>
</div>

<div id="chat">
  <div id="fil"></div>
  <form id="saisie" autocomplete="off">
    <button type="button" id="micro" class="rond" title="Parler (micro)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="texte" placeholder="Posez votre question…">
    <button type="submit" id="envoyer" class="rond" title="Envoyer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@mlc-ai/web-llm": "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/lib/index.js"
  }
}
</script>
<script type="module" src="avatar.js"></script>
<script type="module" src="chat.js"></script>
</body>
</html>
