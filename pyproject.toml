[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripcore"
version = "0.1.0"
description = "RIP for Epson I1600 wall/flatbed UV printers driven by BetterPrinter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# tifffile : Pillow refuse tout TIFF à plus de quatre canaux, c'est-à-dire
# tout export Photoshop portant une couche de ton direct (blanc, vernis).
images = ["pillow>=10", "tifffile>=2024.1"]
dev = ["pytest>=8", "pillow>=10", "tifffile>=2024.1"]

[project.scripts]
rip = "ripcore.cli:main"

[project.gui-scripts]
atelier-impression = "ripcore.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
