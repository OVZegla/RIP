# Profil média — support rigide non blanc, encre UV.
#
# Les chemins ICC sont relatifs à ce fichier. Les profils de sortie livrés avec
# la machine se trouvent dans :
#   ICC Profile/Output/Epson-W5113/{A,B,C}-720x{900,1200}-I1600-{5,10}MM-uv-HK-NEW.icm
# Un profil par (résolution × distance tête–support) : prenez celui qui
# correspond à la hauteur Z réellement utilisée, sinon la couleur dérive.

[media]
name = "Support rigide UV — 720x900, tête à 5 mm"

# icc_output = "../icc/A-720x900-I1600-5MM-uv-HK-NEW.icm"
# icc_input_rgb = "../icc/sRGB.icc"
# icc_input_cmyk = "../icc/ISOcoated_v2.icc"
rendering_intent = "perceptual"

# linearization = "../calib/rigide-uv-720x900.json"

# Sous-couche blanche : indispensable sur support non blanc.
white_underbase = true
white_density = 1.0
white_choke_px = 2

# Surcharge la limite totale du profil imprimante si le support est plus
# sensible (film, support fermé, forte épaisseur d'encre).
# ink_limit_total = 2.4

notes = "Valeurs de départ. À caler par essais avant toute production."

# --- Tons directs préparés dans Photoshop ------------------------------------
#
# Le RIP lit les couches de ton direct d'un TIFF exporté depuis Photoshop
# (canaux supplémentaires + noms). **Une couche dessinée prime sur toute
# génération** : si le fichier porte un « White », c'est lui qui part sur la
# machine, la sous-couche automatique ci-dessus n'est pas calculée pour ce
# tirage. C'est voulu — la couche porte une intention (blanc débordant, relief
# localisé, vernis sélectif) qu'aucun calcul ne devine.
#
# Les noms usuels sont reconnus seuls : White, Blanc, Sous-couche, Underbase,
# Vernis, Varnish, Gloss, Relief… La table ci-dessous sert aux noms maison, et
# prime sur les correspondances usuelles.
#
# [media.spot_map]
# "Couche 1" = "W"
# "Blanc épais" = "W"
# "Relief mat" = "V"     # seulement si la machine porte un canal vernis
#
# Le NIVEAU DE GRIS de la couche dose le blanc, il n'est pas seuillé : une zone
# peinte à 50 % dépose la moitié du blanc (un dot sur deux, donc translucide),
# une zone à 100 % dépose un blanc couvrant. C'est ce qu'on faisait déjà dans
# UltraPrint, et ça reste vrai ici — vérifié par test sur cinq paliers.
#
# ⚠️ SENS DE LA COUCHE. Selon la version de Photoshop et l'option d'export, un
# canal supplémentaire peut être écrit avec 255 pour la pleine encre (comme les
# canaux CMJN du même fichier) ou avec 0. Lue à l'envers, la couche sort en
# négatif — très visible, mais autant ne pas gâcher un panneau pour le
# découvrir. Tranchez la question en trente secondes sur un de vos fichiers :
#
#   rip layers mon-visuel.tif
#
# La commande affiche les deux lectures ; gardez celle qui correspond à ce que
# vous avez peint. Si c'est la seconde, décommentez la ligne ci-dessous.
#
# spot_polarity = "inverse"     # défaut : "direct" (255 = pleine encre)

# ⚠️ DOUBLE RÉTRACTION. BetterPrinter applique lui aussi un retrait au blanc,
# par nInkIndent (§16, BP_SPECAIL_PRINT_CONFIG), exprimé en pixels. Il s'ajoute
# à white_choke_px ci-dessus : les deux cumulés, le blanc se rétracte deux fois
# et un liseré de support apparaît sur les bords. Réglez le retrait d'un seul
# côté — soit ici, soit dans BetterPrinter (nInkIndent = 0) — jamais des deux.
# Une couche dessinée dans Photoshop n'est PAS rétractée par le RIP : le retrait
# y est celui que l'opérateur a dessiné, plus celui de BetterPrinter.
